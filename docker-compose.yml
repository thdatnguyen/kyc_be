version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: kyc-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    # tfjs-node ships a reliable x86-64 native binary; run amd64 (Rosetta 2 on
    # Apple Silicon) so the TensorFlow binding loads.
    platform: linux/amd64
    container_name: kyc-api
    ports:
      # Host 5001 -> container 5000 (macOS ControlCenter occupies host port 5000).
      - '5001:5000'
    env_file:
      - dev.env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  mongo_data:
  uploads_data:
